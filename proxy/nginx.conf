server {
	listen ${PORT};
	server_name _;

	location /api/ {
		proxy_pass ${BACKEND_SITE};
	}

	location / {
		proxy_pass ${FRONTEND_SITE};
	}

	# Extra locations of the deployment, e.g. the mock of test stands (deploy/proxy-mock.conf)
	include /etc/nginx/locations.d/*.conf;

	# Simple healthcheck
	location =/nginx-hc {
		access_log off;
		return 200 'OK';
	}
}
