map $http_upgrade $connection_upgrade {
	default upgrade;
	'' close;
}

server {
	listen ${PORT};
	server_name _;

	location /api/ {
		proxy_pass ${BACKEND_SITE};
	}

	# Realtime updates (Socket.IO): long polling and the upgrade to WebSocket
	location /socket.io/ {
		proxy_pass ${BACKEND_SITE};
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_read_timeout 1h;
	}

	location / {
		proxy_pass ${FRONTEND_SITE};
	}

	# Extra locations of the deployment, e.g. the mock of test stands (deploy/proxy-mock.conf)
	include /etc/nginx/locations.d/*.conf;

	# Simple healthcheck
	location =/nginx-hc {
		access_log off;
		return 200 'OK';
	}
}
