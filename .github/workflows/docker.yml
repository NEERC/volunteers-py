name: Docker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: .
          - image: frontend
            context: ui
            # The frontend bakes these into the bundle at build time, so they come from repository variables
            build-args: |
              MODE=${{ vars.MODE || 'production' }}
              PUBLIC_URL=${{ vars.PUBLIC_URL || '/' }}
              VITE_TELEGRAM_BOT_HANDLE=${{ vars.VITE_TELEGRAM_BOT_HANDLE }}
              VITE_TELEGRAM_BOT_ORIGIN=${{ vars.VITE_TELEGRAM_BOT_ORIGIN }}
          - image: proxy
            context: proxy
          - image: backup
            context: backup

    env:
      # GITHUB_TOKEN of a pull request from a fork can't write packages, so such PRs only check that images build
      PUSH: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      if: env.PUSH == 'true'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract image metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: ${{ matrix.context }}
        build-args: ${{ matrix.build-args }}
        push: ${{ env.PUSH == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=${{ matrix.image }}
        cache-to: type=gha,mode=max,scope=${{ matrix.image }}
