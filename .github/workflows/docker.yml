name: Docker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Test stands build the images of the commit they deploy, see stands.yml
  workflow_call:

concurrency:
  # The workflow name is the caller's one when called, so a stand build and the build
  # of the same pull request don't cancel each other
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: .
          # Configured on container start (base path, Telegram bot), see ui/docker-entrypoint.sh
          - image: frontend
            context: ui
          - image: proxy
            context: proxy
          - image: backup
            context: backup
          # Mock of external systems for test stands, see deploy/compose.mock.yaml
          - image: mock
            context: e2e/mock

    env:
      # GITHUB_TOKEN of a pull request from a fork can't write packages, so such PRs only check that images build
      PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      if: env.PUSH == 'true'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract image metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: ${{ matrix.context }}
        push: ${{ env.PUSH == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=${{ matrix.image }}
        cache-to: type=gha,mode=max,scope=${{ matrix.image }}
