name: E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Output of the stack services (mock, backend, UI), attached to failed tests and uploaded
      E2E_LOG_DIR: ${{ github.workspace }}/e2e/logs

    steps:
    - uses: actions/checkout@v7

    - name: Set PYTHONPATH
      run: echo "PYTHONPATH=$(pwd)" >> $GITHUB_ENV

    - name: Set up Python 3.13
      id: setup-python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v6
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        package_json_file: ui/package.json

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'
        cache: 'pnpm'
        cache-dependency-path: |
          ui/pnpm-lock.yaml
          e2e/pnpm-lock.yaml

    - name: Install UI dependencies
      run: pnpm --dir ui install --frozen-lockfile

    - name: Install e2e dependencies
      run: pnpm --dir e2e install --frozen-lockfile

    - name: Get Playwright version
      id: playwright-version
      run: echo "version=$(pnpm --dir e2e exec playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright browser
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: pnpm --dir e2e exec playwright install --with-deps chromium

    - name: Install Playwright system dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: pnpm --dir e2e exec playwright install-deps chromium

    # Starts the mock of external systems, the backend (database volunteers_e2e) and the UI
    - name: Run e2e tests
      run: pnpm --dir e2e test

    # Failed tests carry labelled full-page screenshots of every user's page, page logs
    # (console, errors, failed API calls), videos, traces and the tail of the service logs
    - name: Upload Playwright report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: e2e/playwright-report/
        retention-days: 14

    - name: Upload test results
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: e2e/test-results/
        retention-days: 14

    - name: Upload service logs
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: service-logs
        path: e2e/logs/
        retention-days: 14
