# Prepares a clean Ubuntu 24.04 cloud image as the staging server of the test stands
# (deploy/README.md): Docker, the deploy user with a generated SSH key, nginx-proxy with
# acme-companion. Prints the repository variables and secrets at the end.
#
#   ansible-playbook staging.yml

- name: Generate the deploy key
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    deploy_key_path: "{{ playbook_dir }}/.keys/stand_deploy"
  tasks:
    - name: Create the key directory
      ansible.builtin.file:
        path: "{{ deploy_key_path | dirname }}"
        state: directory
        mode: "0700"

    - name: Generate an ed25519 key pair
      ansible.builtin.command:
        cmd: ssh-keygen -q -t ed25519 -N "" -C "volunteers-stands-deploy" -f "{{ deploy_key_path }}"
        creates: "{{ deploy_key_path }}"

- name: Set up the staging server
  hosts: staging
  become: true
  pre_tasks:
    # Cloud images come with a ~3 GB root, the disk has to be resized first; cloud-init
    # grows the root partition on the next boot
    - name: Check the free disk space
      vars:
        root_mount: "{{ ansible_mounts | selectattr('mount', 'equalto', '/') | first }}"
      ansible.builtin.assert:
        that: root_mount.size_available >= min_free_disk_gb * 1024**3
        fail_msg: >-
          Only {{ (root_mount.size_available / 1024**3) | round(1) }} GB free on /, at least
          {{ min_free_disk_gb }} GB are needed for Docker and the stands. Resize the disk and reboot
          (or run `growpart /dev/sda 1 && resize2fs /dev/sda1`).
        quiet: true

  roles:
    - docker
    - deploy_user
    - nginx_proxy

  post_tasks:
    - name: Read the SSH host keys
      ansible.builtin.slurp:
        src: "/etc/ssh/ssh_host_{{ item }}_key.pub"
      loop: [ed25519, ecdsa, rsa]
      register: host_keys

    - name: Write the GitHub settings
      vars:
        public_host: "{{ stand_public_host | default(ansible_host) }}"
        public_port: "{{ stand_public_port | default(ansible_port | default(22)) }}"
        known_host_name: "{{ public_host if public_port | int == 22 else '[' ~ public_host ~ ']:' ~ public_port }}"
        known_hosts: |-
          {% for key in host_keys.results %}
          {{ known_host_name }} {{ (key.content | b64decode).split()[:2] | join(' ') }}
          {% endfor %}
      become: false
      delegate_to: localhost
      ansible.builtin.copy:
        dest: "{{ deploy_key_path | dirname }}/github-settings.sh"
        mode: "0700"
        content: |
          #!/bin/sh
          # Repository settings of the test stands (deploy/README.md), generated by
          # ansible/staging.yml. Run from the repository root.
          set -eu
          gh secret set STAND_SSH_KEY < ansible/.keys/stand_deploy
          gh variable set STAND_SSH_HOST --body '{{ public_host }}'
          gh variable set STAND_SSH_PORT --body '{{ public_port }}'
          gh variable set STAND_SSH_USER --body '{{ deploy_user }}'
          gh variable set STAND_PROXY_NETWORK --body '{{ proxy_network }}'
          gh variable set STAND_SSH_KNOWN_HOSTS --body '{{ known_hosts | trim }}'
          # Set the domain of the stands, *.<domain> has to point to the server:
          # gh variable set STAND_DOMAIN --body staging.example.com
      register: github_settings

    - name: Print the GitHub settings
      ansible.builtin.debug:
        msg: >-
          {{ ['Deploy public key (in ~' ~ deploy_user ~ '/.ssh/authorized_keys):',
              lookup('ansible.builtin.file', deploy_key_path ~ '.pub'),
              '',
              'Repository settings: ansible/.keys/github-settings.sh',
              '']
             + lookup('ansible.builtin.file', github_settings.dest).splitlines() }}
